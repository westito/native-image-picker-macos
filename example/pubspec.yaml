publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  native_image_picker_macos:
    path: ../
  image_picker_macos: ^0.2.1+2
  image_picker: ^1.2.0
  video_player: ^2.10.0

dev_dependencies:
