    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.1
  build_runner: ^2.9.0
  image_picker_platform_interface: ^2.11.0
  plugin_platform_interface: ^2.1.8


flutter:
  uses-material-design: true
